name: Recall

options:
  bundleIdPrefix: com.nickdhm
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2600"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Recall:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    sources:
      - path: Recall
    settings:
      base:
        PRODUCT_NAME: Recall
        PRODUCT_BUNDLE_IDENTIFIER: com.nickdhm.recall
        INFOPLIST_FILE: Recall/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

  RecallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecallTests
    dependencies:
      - target: Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickdhm.recall.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  Recall:
    build:
      targets:
        Recall: all
        RecallTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - RecallTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
